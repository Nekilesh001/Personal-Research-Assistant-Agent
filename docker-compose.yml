# ═══════════════════════════════════════════════════
# Personal Research Assistant Agent — Deployment
# ═══════════════════════════════════════════════════
# This version pulls pre-built images from Docker Hub.
# Usage:
#   1. cp .env.example .env  # fill in GROQ_API_KEY
#   2. docker-compose up -d

services:
  # ─── Backend (FastAPI/Python) ───────────────────
  backend:
    image: nekilesh/research-assistant-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - SQLITE_DB_PATH=/app/data/research_agent.db
    volumes:
      - chroma_data:/app/chroma_db
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ─── Frontend (React/Vite → nginx) ─────────────
  frontend:
    image: nekilesh/research-assistant-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
  sqlite_data:
    driver: local
